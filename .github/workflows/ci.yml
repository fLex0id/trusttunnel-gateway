name: Проверки
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка
        run: python3 build.py
      - name: ShellCheck
        run: shellcheck -S warning -e SC2034,SC2154 dist/tt.sh install.sh
      - name: Синтаксис bash
        run: bash -n dist/tt.sh && bash -n install.sh
      - name: Тесты генераторов
        run: python3 -m unittest discover -s tests -v
  rocky9:
    name: Тесты на Rocky Linux 9 (Python 3.9)
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version && python3 -m unittest discover -s tests -v
